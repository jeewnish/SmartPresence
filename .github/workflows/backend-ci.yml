name: Backend CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Unit, integration, and migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Maven wrapper
        run: ./mvnw --version

      - name: Run unit and integration tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Validate Compose configuration
        run: docker compose config --quiet

  container:
    name: Build and scan container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build local validation image
        run: docker build --tag smartpresence-api:validation .

      - name: Scan critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: smartpresence-api:validation
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v2
