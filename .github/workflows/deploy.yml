name: Deploy SmartPresence API

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  test-build-deploy:
    name: Test, publish, and deploy immutable image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment || 'staging' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
      ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
      SMOKE_BASE_URL: ${{ vars.API_BASE_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit and integration tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image once
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: docker build --tag "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" .

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

      - name: Push immutable image and resolve digest
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        shell: bash
        run: |
          set -euo pipefail
          image_tag="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker push "$image_tag"
          digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          test -n "$digest"
          test "$digest" != "None"
          echo "uri=$REGISTRY/$ECR_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Register task-definition revision
        id: task
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        shell: bash
        run: |
          set -euo pipefail
          previous_task="$(aws ecs describe-services --cluster "$ECS_CLUSTER_NAME" --services "$ECS_SERVICE_NAME" --query 'services[0].taskDefinition' --output text)"
          test -n "$previous_task"
          test "$previous_task" != "None"
          aws ecs describe-task-definition --task-definition "$previous_task" --query taskDefinition > current-task.json
          jq --arg image "$IMAGE_URI" --arg container "$ECS_CONTAINER_NAME" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            | .containerDefinitions |= map(if .name == $container then .image = $image else . end)
          ' current-task.json > next-task.json
          matches="$(jq --arg container "$ECS_CONTAINER_NAME" '[.containerDefinitions[] | select(.name == $container)] | length' next-task.json)"
          test "$matches" -eq 1
          next_task="$(aws ecs register-task-definition --cli-input-json file://next-task.json --query 'taskDefinition.taskDefinitionArn' --output text)"
          echo "previous=$previous_task" >> "$GITHUB_OUTPUT"
          echo "next=$next_task" >> "$GITHUB_OUTPUT"

      - name: Deploy registered revision
        run: >-
          aws ecs update-service
          --cluster "$ECS_CLUSTER_NAME"
          --service "$ECS_SERVICE_NAME"
          --task-definition "${{ steps.task.outputs.next }}"
          --query 'service.taskDefinition'
          --output text

      - name: Wait for ECS stability
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER_NAME" --services "$ECS_SERVICE_NAME"

      - name: Smoke-test deployed API
        if: env.SMOKE_BASE_URL != ''
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 15 "$SMOKE_BASE_URL/actuator/health")"
          jq -e '.status == "UP"' <<< "$response"

      - name: Roll back failed deployment
        if: failure() && steps.task.outputs.previous != ''
        shell: bash
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$ECS_CLUSTER_NAME" --service "$ECS_SERVICE_NAME" --task-definition "${{ steps.task.outputs.previous }}"
          aws ecs wait services-stable --cluster "$ECS_CLUSTER_NAME" --services "$ECS_SERVICE_NAME"

      - name: Publish deployment evidence
        if: success()
        run: |
          echo "### Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ inputs.environment || 'staging' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image digest: ${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Previous task: ${{ steps.task.outputs.previous }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Current task: ${{ steps.task.outputs.next }}" >> "$GITHUB_STEP_SUMMARY"
