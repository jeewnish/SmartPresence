version: "3.9"
services:

  postgres:
    image: postgres:15-alpine
    container_name: smartpresence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartpresence
      POSTGRES_USER: smartpresence_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Dev@Pass123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpresence_user -d smartpresence"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: smartpresence-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: dev-file
      KC_HTTP_PORT: 8180
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_data:/opt/keycloak/data
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    container_name: smartpresence-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartpresence-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      DB_USERNAME: smartpresence_user
      DB_PASSWORD: ${DB_PASSWORD:-Dev@Pass123}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartpresence
      KEYCLOAK_ISSUER_URI: http://keycloak:8180/realms/smartpresence
      KEYCLOAK_JWKS_URI: http://keycloak:8180/realms/smartpresence/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_CLIENT_ID: smartpresence-admin-cli
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-smartpresence-admin-secret}
      KEYCLOAK_REALM: smartpresence
      KEYCLOAK_ADMIN_URL: http://keycloak:8180
      BEACON_API_KEY: ${BEACON_API_KEY:-dev-beacon-key-change-in-prod}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    volumes:
      - app_logs:/var/log/smartpresence

  dashboard:
    image: node:20-alpine
    container_name: smartpresence-dashboard
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - app
      - keycloak
    environment:
      BACKEND_URL: http://app:8080
      KEYCLOAK_URL: http://keycloak:8180
      VITE_KEYCLOAK_REALM: smartpresence
      VITE_KEYCLOAK_CLIENT_ID: smartpresence-backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ../dashboard:/app

  localtunnel-keycloak:
    image: node:20-alpine
    container_name: smartpresence-localtunnel-keycloak
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      - keycloak
    command: >
      sh -c "npx --yes localtunnel --port 8180 --local-host keycloak --subdomain ${LT_KEYCLOAK_SUBDOMAIN:-smartpresence-auth}"

  localtunnel-api:
    image: node:20-alpine
    container_name: smartpresence-localtunnel-api
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      - app
    command: >
      sh -c "npx --yes localtunnel --port 8080 --local-host app --subdomain ${LT_API_SUBDOMAIN:-smartpresence-api}"

volumes:
  postgres_data:
  keycloak_data:
  app_logs:
