# Staging Lambda profile. API Gateway validates Clerk JWTs before invocation.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.keepalive-time=0

# Avoid initializing a remote JWKS decoder in the Lambda profile.
spring.autoconfigure.exclude=org.springframework.boot.security.oauth2.server.resource.autoconfigure.servlet.OAuth2ResourceServerAutoConfiguration
