spring.application.name=smartpresence-backend

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartpresence}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Academic catalog
app.academic.active-semester=${APP_ACADEMIC_ACTIVE_SEMESTER:Semester 2}

# Clerk (keys kept for reference; JWT validation uses JWKS — no per-request API call)
clerk.secret-key=${CLERK_SECRET_KEY:}
clerk.publishable-key=${CLERK_PUBLISHABLE_KEY:}

# Spring Security — OAuth2 Resource Server (validates Clerk JWTs locally via JWKS)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${CLERK_JWKS_URI:https://simple-fish-72.clerk.accounts.dev/.well-known/jwks.json}

# Attendance token (JJWT-signed, separate from Clerk)
# Secret must be at least 32 characters for HS256
attendance.token.secret=${ATTENDANCE_TOKEN_SECRET:SmartPresenceAttendanceTokenSecretKeyMustBe32Chars!}
attendance.token.ttl-seconds=60

# BLE validation
attendance.rssi.threshold=-80
attendance.ble.expiry-window-seconds=300

# Offline sync: validate timestamp within session window (not server time)
attendance.offline.session-window-hours=24

server.port=${SERVER_PORT:8080}

# JSON
spring.jackson.default-property-inclusion=non_null
